# Git hooks. Installed by `pnpm install` (lefthook postinstall). Skip once: LEFTHOOK=0 git ...
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: secretlint
      run: pnpm exec secretlint --maskSecrets {staged_files}
    - name: i18n
      glob: "{src/**/*.tsx,messages/*.json}"
      run: node scripts/messages/check.mjs

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: guard-main
      run: sh scripts/guard-main-push.sh
    - name: typecheck
      run: pnpm typecheck
    - name: unit-tests
      run: pnpm test
